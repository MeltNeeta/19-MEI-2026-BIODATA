<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript hari kedua</title>
</head>
<body>

    <!-- Merubah warna -->
    <p id="demo">This is the text.</p>

    <button type="button" onclick="document.getElementById('demo'). style.color = 'red'">Red Text</button>

    <button type="button" onclick="document.getElementById('demo'). style.color = 'blue'">Blue Text</button>

    
    <!-- menghilangkan teks -->
    <p id="demosatu">Aku dapat menghilang!</p>

    <button type="button" onclick="document.getElementById('demosatu'). style.display = 'none'">Menghilang</button>

    <button type="button" onclick="document.getElementById('demosatu'). style.display = 'block'">Muncul</button>

</body>
</html>

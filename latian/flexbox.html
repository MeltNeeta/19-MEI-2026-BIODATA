<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox & Grid</title>
    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(167, 53, 72);
            color: aliceblue;
            padding: 20px 10px;
            margin-top: 20px;
        }

        .menu-links {
            display: flex;
            flex-direction: row;
            gap: 20px;
            list-style: none;
        }

    .menu-links a {
        text-decoration: none;
        color: aliceblue;
    }
    </style>
</head>
<body>
    
    <nav class="navbar">

        <div class="logo">Contoh logo</div>
        <ul class="menu-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">History</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

</body>
</html>

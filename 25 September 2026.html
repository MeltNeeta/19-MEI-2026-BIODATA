<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List Sederhana</title>
    <link rel="stylesheet" href="25 September 2026.css">
</head>
<body>
    <h1>MY TASK BOARD</h1>
    <!-- Input Tugas Baru -->
    <div class="form-container">
        <input type="text" id="inputText" placeholder="Tulis Tugas Baru"/>
        <button id="btn-tambah">+</button>
    </div>

    <!-- Papan 2 kolom -->
    <div class="board">
        <div class="column">
            <h3>On Going</h3>
            <div id="colToDo"></div>
        </div>
        <div class="column">
            <h3>Done</h3>
            <div id="colDone"></div>
        </div>
    </div>

    <script src="25 September 2026.js"></script>
</body>
</html>

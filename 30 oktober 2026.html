<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix by Tegar</title>\
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(45deg, black, black, cadetblue);
            color: aliceblue;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 28px;
        }

        p {
            color: darkcyan;
            font-size: 16px;
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            background-color: mediumturquoise;
            color: black;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            animation: updown 2s infinite;
        }
        @keyframes updown {
            0%{transform: translateY(0px);}
            20%{transform: translateY(-10px);}
            60%{transform: translateY(5px);}
            100%{transform: translateY(0px);}
        }

        input:focus {
            animation: none;
            background-color: black;
            color: cadetblue;
            border: 2px solid cadetblue;
            transition: 0.2s;
        }

        .movie-grid {
            gap: 15px;
            margin-top: 15px;
            text-align: left;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
        }

        .movie-card {
            background-color: cadetblue;
            border-radius: 6px;
            border: 2px solid black;
            padding: 10px;
            border-radius: 20px;
            width: 200px;
            text-align: center;
            justify-items: center;
        }
        .movie-card:hover {
            background-color: transparent;
            scale: 1.05;
            transition: 0.2s;
            border: solid 2px cadetblue;
        }
        .movie-card h4 {
            font-family: "Arimo", sans-serif;
            font-size: 18px;
            font-weight: 400;
        }   
        .movie-card img {
            max-width: 300px;
            max-height: 250px;
            border-radius: 10px;
        }



    </style>
</head>
<body>
    <div class="container">
        <h2>Netflix By Audrey</h2>
        <p>Cari Film Favoritmu Sekarang</p>

        <input type="text" id="searchBox" placeholder="Cari film... (Naruto, One Piece, Doraemon, dll)"/>
        <div class="movie-grid" id="movieGrid">

        </div>
    </div>

    <script>
        $(document).ready(function(){
            $("#searchBox").on('keyup', function(){
                let keyword = $(this).val().trim();
                if (keyword.length <2) {
                    $("#movieGrid").html('');
                    return;
                }

                $("#movieGrid").html('<p>Cari Film di Server</p>')

                // ambil film dari data umum API
                $.get(`https://api.tvmaze.com/search/shows?q=${keyword}`, function(response){
                    $('#movieGrid').empty();

                    if (response.length>0) {
                        $.each(response, function(index, item){
                            let show = item.show;
                            let poster = show.image ? show.image.medium: 'https://via.placeholder.com/150?text=No+Image';

                            let card = `
                            <div class="movie-card">
                                <img src="${poster}" alt="poster"/>
                                <div class="movie-info">
                                    <h4 class="movie-title">${show.name}</h4>
                                </div>
                            </div>
                            `;
                            $('#movieGrid').append(card);
                        })
                    }                    

                })
            });
        });
    </script>
</body>
</html>

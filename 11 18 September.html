<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- Destructuring, Spread Operator, Rest Operator -->

    <script>
        console.log("Destructuring");
        // Data Objek Utama
        const siswa ={nama: "Arez", kelas: "12 rpl"};
        
        // Cara Lama
        const namaLama = siswa.nama;
        const kelasLama = siswa.kelas;
        console.log ("Cara Lama: ", namaLama, kelasLama);

        // Cara Baru
        const { nama, kelas } = siswa;
        console.log( "Cara Baru: ", nama, kelas);

        // Challenge
        const wallet ={user: "Budi", saldo: "5.000.000"};

        const { user, saldo } = wallet;
        console.log( user, "memiliki saldo sebesar", saldo);

        console.log("Spread Operator");
        // Spread Operator
        const timA =["Andi", "Budi"];
        const timB =["Sigit", "Raffa"];
        const timGabungan = [...timA, ...timB];
        console.log("Tim Gabungan: ", timGabungan);
        // 
        const timC =["Agus", "Budi", "Sigit", "Raffa"];
        const timD =["Mya", "Laila", "Mari", "Kira"];
        const timE =["Maya", "Rana", "Mai", "Ryu"];
        const timGabung = [...timC, ...timD, ...timE];
        console.log("Tim Gabungan: ", timGabung);

        console.log("Rest Operator");
        // Rest Operator
        // Rest(Sisa) Operator

        // Daftar Pemain
        const anggota = ["Coach Justin", "Ernando Ari", "Arez", "Tegar", "Aldrich"];
        //mengambil pelatih, kiper, dan cadangan
        const [Pelatih, Kiper, ...cadangan] = anggota;
        // Memanggil
        console.log("Pelatih : ", Pelatih);
        console.log("Kiper Utama : ", Kiper);
        console.log("Pemain Cadangan : ", cadangan);
        console.log("Pemain Cadangan : ", cadangan.length, "Orang");

        // challenge
        const pelomba = ["dila", "Ari", "Arez", "Tegar", "Aldrich", "Maya"];
        const [satu, dua, tiga, ...favorit] = pelomba;
        console.log("Juara 1 : ", satu);
        console.log("Juara 2 : ", dua);
        console.log("Juara 3 : ", tiga);
        console.log("Juara Favorit : ", favorit);

        //challenge
        const pengurus = ["dila", "Ari", "Arez", "Tegar", "Aldrich", "Maya", "Audrey"];
        const [ketua, wakil, ...anggotakelas] = pengurus;
        console.log("Ketua : ", ketua);
        console.log("Wakil : ", wakil);
        console.log("Anggota : ", anggotakelas);
        console.log("Total Anggota : ", anggotakelas.length, "siswa");

    </script>

</body>
</html>
